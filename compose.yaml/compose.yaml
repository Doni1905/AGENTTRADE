services:
  n8n:
    image: n8nio/n8n:2.40.7
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on: [api, ollama, qdrant]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.11.10
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
  api:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      DATABASE_PATH: /state/ledger.sqlite3
      ALPACA_PAPER_KEY_ID: ${ALPACA_PAPER_KEY_ID:-}
      ALPACA_PAPER_SECRET_KEY: ${ALPACA_PAPER_SECRET_KEY:-}
      APPROVAL_CODE: ${APPROVAL_CODE:?Set a local approval code in .env}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["ledger_data:/state"]
    depends_on: [ollama, qdrant]
    restart: unless-stopped
volumes:
  n8n_data:
  ollama_data:
  qdrant_data:
  ledger_data:
